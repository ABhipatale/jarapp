<!doctype html>
<html lang="mr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1e3a8a" />
    <meta name="description" content="साई वॉटर सप्लायर्स, कोळेवाडी – जार व्यवस्थापन" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- iPhone: install to home screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="साई वॉटर" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <title>साई वॉटर सप्लायर्स – जार व्यवस्थापन</title>
    <style>
      /* Splash shown instantly while the app loads (also on iPhone, which has no manifest splash). */
      #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: linear-gradient(180deg, #eff6ff 0%, #ffffff 60%); font-family: system-ui, sans-serif; z-index: 50; }
      #splash img { width: 96px; height: 96px; border-radius: 24px; box-shadow: 0 10px 30px rgba(30,58,138,.18); }
      #splash h1 { margin: 18px 0 2px; font-size: 20px; color: #1e3a8a; }
      #splash p { margin: 0; color: #64748b; font-size: 14px; }
    </style>
  </head>
  <body>
    <div id="splash">
      <img src="/icons/icon-192.png" alt="" />
      <h1>साई वॉटर सप्लायर्स</h1>
      <p>कोळेवाडी · जार व्यवस्थापन</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
